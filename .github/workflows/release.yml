name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Sakeenah v__VERSION__"
          releaseBody: |
            سَكينة v__VERSION__ — المصحف العثماني كاملًا دون إنترنت، وأذان صوتي وإشعارات لكل صلاة، ومواقيت الصلاة، وأذكار حصن المسلم، والتاريخ الهجري والقبلة، والصوت الحر.

            The full Uthmani Quran is bundled offline (114 surahs, 6236 ayahs) with surah and juz reading, bookmarks, last-position resume and the ayah of the day. A three-file download queue supports bulk surah and full-mushaf downloads with cancel, retry and resumable partial files, plus a storage panel with multi-select deletion. Prayer times are calculated offline on your device (Umm al-Qura, Muslim World League, and more), with a prayer log, streak, excused days, Hijri date and a manual qibla dial. A CC0 adhan plays with per-prayer sound and notification switches, optional pre-alerts and a saved volume; the tray shows the next prayer, can start with Windows hidden, and keeps alerts running when the window is closed until you quit from the tray. The full Hisn al-Muslim is bundled with tap counters, saved progress and a separate daily adhkar streak.

            Updating from Dandanah 0.1.0? Your library and downloads migrate automatically on first launch. Uninstall the old app afterwards.

            See the assets below to download the installer.
          releaseDraft: false
          prerelease: false
