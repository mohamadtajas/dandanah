name: Mobile

on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    name: Android analyze, test, debug + release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify bundled Quran matches Tanzil source
        working-directory: .
        run: |
          node scripts/build-quran.mjs
          git diff --exit-code -- src-tauri/data/quran.json mobile/assets/data/quran.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - run: flutter build apk --debug

      - name: Build release APK (debug-signed for smoke testing)
        run: flutter build apk --release

      - name: Release APK keeps adhan audio and INTERNET
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test "$(unzip -l "$APK" | grep -c '\.ogg')" -ge 3
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/aapt2" dump permissions "$APK" | grep -q 'android.permission.INTERNET'

      - uses: actions/upload-artifact@v4
        with:
          name: sakeenah-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: sakeenah-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios-compile:
    name: iOS compile (no signing)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
