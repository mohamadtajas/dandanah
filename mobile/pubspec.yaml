name: sakeenah_mobile
description: "Sakeenah — Quran, prayer times, adhkar and audio."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  intl: any
  cupertino_icons: ^1.0.8
  drift: ^2.35.4
  path_provider: ^2.1.6
  path: ^1.9.1
  adhan: ^2.0.0+1
  hijri: ^3.0.1
  timezone: ^0.11.2
  geolocator: ^14.1.2
  scrollable_positioned_list: ^0.3.8
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  flutter_local_notifications: 22.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  crypto: ^3.0.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/data/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
          weight: 400
